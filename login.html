<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Online Restaurant</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <strong>Step</strong>
        <span>Ordering</span>
      </div>
      <nav class="top-nav">
        <a href="./index.html">Home/Menu</a>
        <a href="./cart.html">Cart</a>
      </nav>
      <div id="authNav" class="auth-nav"></div>
    </header>

    <main class="container auth-page">
      <h2 class="page-title">Login</h2>
      <form id="loginForm" class="form-card" novalidate>
        <label for="loginEmail">Email</label>
        <input id="loginEmail" name="email" type="email" placeholder="you@example.com" />

        <label for="loginPassword">Password</label>
        <input id="loginPassword" name="password" type="password" placeholder="Enter password" />

        <button type="submit" class="btn-danger full-width">Login</button>
      </form>
      <p id="loginMessage" class="form-message" role="alert"></p>
      <p class="auth-switch">
        Don't have an account?
        <a href="./register.html">Register here</a>
      </p>
    </main>

    <script src="./js/auth.js"></script>
  </body>
</html>
